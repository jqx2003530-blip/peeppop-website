media:
  input: images
  output: /images

content:
  - name: works
    label: Works
    type: collection
    path: content/works
    filename: '{primary}.json'
    format: json
    view:
      fields: [title, category, year]
      primary: title
      sort: [year, title]
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: category
        label: Category
        type: string
        options:
        values:
          - textile
          - sketches
          - projects
        required: true

      - name: year
        label: Year
        type: number
      - name: description
        label: Description
        type: text
      - name: cover
        label: Cover image
        type: image
      - name: gallery
        label: Gallery
        type: image
        list: true

        
  - name: about
    label: About
    type: file
    path: content/about.json
    fields:
      - name: intro
        label: Introduction
        type: text
      - name: education
        label: Education
        type: text
      - name: research
        label: Research
        type: text
      - name: exhibitions
        label: Exhibitions
        type: text
      - name: contact
        label: Contact
        type: string
